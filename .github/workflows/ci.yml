
name: CI-CD Sistema Bancario

on:
  push:
    branches:
      - develop
    tags:
      - 'rc-*'
  pull_request:
    branches:
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Build do sistema
        run: python -m compileall -q backend frontend tests

      - name: Analise de qualidade
        run: python -m ruff check .

      - name: Executar testes unitarios
        run: python -m pytest -v

      - name: Empacotar sistema
        if: startsWith(github.ref, 'refs/tags/rc-')
        run: git archive --format=zip --output=sistema-bancario.zip HEAD

      - name: Disponibilizar pacote
        if: startsWith(github.ref, 'refs/tags/rc-')
        uses: actions/upload-artifact@v4
        with:
          name: sistema-bancario
          path: sistema-bancario.zip
